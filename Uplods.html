<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Upload Mod Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
}

.container{
  max-width:800px;
  margin:auto;
  padding:20px;
}

h1{
  font-size:20px;
  margin-bottom:15px;
  color:#00c853;
}

.card{
  background:#1c1c1c;
  padding:15px;
  border-radius:16px;
  margin-bottom:15px;
}

input,
textarea,
select{
  width:100%;
  margin-top:8px;
  padding:14px;
  border-radius:12px;
  border:none;
  background:#2a2a2a;
  color:white;
  outline:none;
  box-sizing:border-box;
  font-size:15px;
}

textarea{
  height:100px;
  resize:none;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  cursor:pointer;
  font-weight:bold;
  font-size:15px;
}

.btn-main{
  background:#00c853;
  color:black;
}

.btn-sec{
  background:#2196f3;
  color:white;
}

.user-box{
  background:#151515;
  border:1px solid #2a2a2a;
  padding:14px;
  border-radius:14px;
  margin-bottom:15px;
}

.user-box span{
  color:#00c853;
  font-weight:bold;
}

/* UPLOAD PROFISSIONAL */
.upload-box{
  background:#222;
  border-radius:14px;
  padding:14px;
  margin-top:14px;
  border:1px solid #333;
}

.upload-top{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}

.upload-icon{
  width:50px;
  height:50px;
  border-radius:14px;
  background:#00c853;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  color:black;
  flex-shrink:0;
}

.upload-title{
  font-size:15px;
  font-weight:bold;
}

.upload-desc{
  font-size:12px;
  color:#aaa;
  margin-top:4px;
}

.custom-upload{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#00c853;
  color:black;
  border-radius:12px;
  padding:14px;
  cursor:pointer;
  font-weight:bold;
  text-align:center;
  transition:0.2s;
  min-height:24px;
}

.custom-upload:hover{
  transform:scale(1.02);
  background:#00e676;
}

.custom-upload input{
  display:none;
}

/* LISTAS */
.list{
  margin-top:10px;
}

.item{
  background:#2a2a2a;
  padding:10px;
  margin-top:6px;
  border-radius:10px;
  font-size:13px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.del-btn{
  background:#ff3b3b;
  border:none;
  color:white;
  width:34px;
  height:34px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

/* MODAL UPLOAD */
.upload-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.upload-modal-box{
  width:90%;
  max-width:340px;
  background:#1b1b1b;
  border-radius:20px;
  padding:25px;
  text-align:center;
}

.upload-spinner{
  width:65px;
  height:65px;
  border:5px solid #333;
  border-top:5px solid #00c853;
  border-radius:50%;
  margin:auto;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  0%{
    transform:rotate(0deg);
  }

  100%{
    transform:rotate(360deg);
  }
}

.upload-status{
  margin-top:22px;
  font-size:16px;
  font-weight:bold;
}

.upload-sub{
  margin-top:8px;
  color:#aaa;
  font-size:13px;
}

</style>
</head>

<body>

<div class="container">

<h1>📦 Upload de Mods Pro</h1>

<div class="user-box">

  Logado como:
  <span id="nickLogado">
    Carregando...
  </span>

</div>

<!-- INFORMAÇÕES -->
<div class="card">

  <h3>📋 Informações</h3>

  <input
  id="nome"
  placeholder="Nome do Mod">

  <textarea
  id="descricao"
  placeholder="Descrição do mod"></textarea>

  <input
  id="versao"
  placeholder="Versão do Mod">

  <select id="categoria">

    <option value="">
      Categoria
    </option>

    <option>
      Roupas
    </option>

    <option>
      Armas
    </option>

    <option>
      Veiculos
    </option>

    <option>
      Construções
    </option>

    <option>
      Variados
    </option>

  </select>

</div>

<!-- ARQUIVOS -->
<div class="card">

  <h3>📂 Arquivos do Mod</h3>

  <!-- ZIP -->
  <div class="upload-box">

    <div class="upload-top">

      <div class="upload-icon">
        📦
      </div>

      <div>

        <div class="upload-title">
          Arquivo ZIP do Mod
        </div>

        <div class="upload-desc">
          Envie o arquivo principal .ZIP
        </div>

      </div>

    </div>

    <label class="custom-upload">

      <input
      type="file"
      id="zip"
      accept=".zip">

      <span id="zipText">
        Escolher arquivo ZIP
      </span>

    </label>

  </div>

  <!-- ÍCONE -->
  <div class="upload-box">

    <div class="upload-top">

      <div class="upload-icon">
        🖼️
      </div>

      <div>

        <div class="upload-title">
          Ícone do Mod
        </div>

        <div class="upload-desc">
          Imagem principal do mod
        </div>

      </div>

    </div>

    <label class="custom-upload">

      <input
      type="file"
      id="icone"
      accept="image/*">

      <span id="iconText">
        Escolher imagem
      </span>

    </label>

  </div>

  <!-- IMAGENS -->
  <div class="upload-box">

    <div class="upload-top">

      <div class="upload-icon">
        📸
      </div>

      <div>

        <div class="upload-title">
          Screenshots do Mod
        </div>

        <div class="upload-desc">
          Envie de 1 até 5 imagens
        </div>

      </div>

    </div>

    <label class="custom-upload">

      <input
      type="file"
      id="imagens"
      multiple
      accept="image/*">

      <span id="imgsText">
        Escolher imagens
      </span>

    </label>

  </div>

</div>

<!-- DEPENDÊNCIAS -->
<div class="card">

  <h3>🔗 Dependências</h3>

  <input
  id="depNome"
  placeholder="Nome da dependência">

  <input
  id="depLink"
  placeholder="Link da dependência">

  <button
  class="btn-sec"
  onclick="addDep()">

    Adicionar Dependência

  </button>

  <div
  class="list"
  id="deps"></div>

</div>

<!-- VIDEOS -->
<div class="card">

  <h3>🎥 Vídeos YouTube</h3>

  <input
  id="videoLink"
  placeholder="Link do vídeo">

  <button
  class="btn-sec"
  onclick="addVideo()">

    Adicionar Vídeo

  </button>

  <div
  class="list"
  id="videos"></div>

</div>

<!-- ENVIAR -->
<div class="card">

  <button
  class="btn-main"
  id="uploadBtn">

    🚀 Enviar Mod

  </button>

</div>

</div>

<!-- MODAL -->
<div
class="upload-modal"
id="uploadModal">

  <div class="upload-modal-box">

    <div class="upload-spinner"></div>

    <div
    class="upload-status"
    id="uploadStatus">

      Preparando upload...

    </div>

    <div
    class="upload-sub"
    id="uploadSub">

      Aguarde...

    </div>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getStorage,
  ref,
  uploadBytesResumable,
  getDownloadURL
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

import {
  getDatabase,
  ref as dbRef,
  push
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

  apiKey:
  "AIzaSyB5A-ySceXCFRQ7iSCnOA68nRJqYpK6DQc",

  databaseURL:
  "https://dayzozmbi-server-default-rtdb.firebaseio.com",

  projectId:
  "dayzozmbi-server",

  storageBucket:
  "dayzozmbi-server.firebasestorage.app",

  messagingSenderId:
  "221905253103",

  appId:
  "1:221905253103:android:fc1bc06782cf5735c4611a"

};

const app =
initializeApp(firebaseConfig);

const storage =
getStorage(app);

const db =
getDatabase(app);

let dependencias = [];
let videos = [];

/* USUÁRIO */
const usuario =
JSON.parse(
localStorage.getItem("usuarioModSteam")
);

if(!usuario || !usuario.nick){

  alert("Faça login primeiro!");

  location.href =
  "Login.html";

}

document.getElementById("nickLogado")
.innerText = usuario.nick;

/* TEXTO DOS ARQUIVOS */
const zipInput =
document.getElementById("zip");

const iconInput =
document.getElementById("icone");

const imgsInput =
document.getElementById("imagens");

zipInput.onchange = ()=>{

  document.getElementById("zipText")
  .innerText =

  zipInput.files[0]
  ? "✅ " + zipInput.files[0].name
  : "Escolher arquivo ZIP";

};

iconInput.onchange = ()=>{

  document.getElementById("iconText")
  .innerText =

  iconInput.files[0]
  ? "✅ " + iconInput.files[0].name
  : "Escolher imagem";

};

imgsInput.onchange = ()=>{

  document.getElementById("imgsText")
  .innerText =

  imgsInput.files.length > 0
  ? `✅ ${imgsInput.files.length} imagem(ns) selecionada(s)`
  : "Escolher imagens";

};

/* DEPENDÊNCIAS */
window.addDep = ()=>{

  const nome =
  document.getElementById("depNome").value;

  const link =
  document.getElementById("depLink").value;

  if(!nome || !link){

    return alert("Preencha tudo!");

  }

  dependencias.push({
    nome,
    link
  });

  renderDeps();

  document.getElementById("depNome").value = "";
  document.getElementById("depLink").value = "";

};

function renderDeps(){

  const el =
  document.getElementById("deps");

  el.innerHTML = "";

  dependencias.forEach((d,i)=>{

    const div =
    document.createElement("div");

    div.className = "item";

    div.innerHTML = `
      <span>🔗 ${d.nome}</span>

      <button class="del-btn">
        🗑️
      </button>
    `;

    div.querySelector(".del-btn")
    .onclick = ()=>{

      dependencias.splice(i,1);

      renderDeps();

    };

    el.appendChild(div);

  });

}

/* VIDEOS */
window.addVideo = ()=>{

  const link =
  document.getElementById("videoLink").value;

  if(!link){

    return alert("Digite um link!");

  }

  videos.push(link);

  renderVideos();

  document.getElementById("videoLink").value = "";

};

function renderVideos(){

  const el =
  document.getElementById("videos");

  el.innerHTML = "";

  videos.forEach((v,i)=>{

    const div =
    document.createElement("div");

    div.className = "item";

    div.innerHTML = `
      <span>🎥 ${v}</span>

      <button class="del-btn">
        🗑️
      </button>
    `;

    div.querySelector(".del-btn")
    .onclick = ()=>{

      videos.splice(i,1);

      renderVideos();

    };

    el.appendChild(div);

  });

}

/* STATUS MODAL */
function setStatus(t,s){

  document.getElementById("uploadStatus")
  .innerText = t;

  document.getElementById("uploadSub")
  .innerText = s;

}

/* UPLOAD */
document.getElementById("uploadBtn")
.addEventListener("click", async ()=>{

  const nome =
  document.getElementById("nome").value;

  const descricao =
  document.getElementById("descricao").value;

  const versao =
  document.getElementById("versao").value;

  const categoria =
  document.getElementById("categoria").value;

  const zip =
  zipInput.files[0];

  const icone =
  iconInput.files[0];

  const imagens =
  imgsInput.files;

  if(
    !nome ||
    !descricao ||
    !versao ||
    !categoria ||
    !zip ||
    !icone
  ){

    return alert("Preencha tudo!");

  }

  if(imagens.length < 1 || imagens.length > 5){

    return alert("Envie de 1 a 5 imagens!");

  }

  document.getElementById("uploadModal")
  .style.display = "flex";

  try{

    const base =
    "mods/" + Date.now();

    const nomeSeguro = nome

    .normalize("NFD")

    .replace(/[\u0300-\u036f]/g,"")

    .replace(/[^a-zA-Z0-9 ]/g,"")

    .trim()

    .replace(/\s+/g,"_");

    const tamanhoMB =
    (zip.size / 1024 / 1024)
    .toFixed(1);

    /* ZIP */
    setStatus(
      "📦 Enviando arquivo ZIP...",
      "Fazendo upload do mod"
    );

    const zipRef =
    ref(storage,
    `${base}/${nomeSeguro}.zip`);

    await uploadBytesResumable(
      zipRef,
      zip
    );

    const zipURL =
    await getDownloadURL(zipRef);

    /* ÍCONE */
    setStatus(
      "🖼️ Enviando ícone...",
      "Upload da capa do mod"
    );

    const iconRef =
    ref(storage,
    `${base}/icon.png`);

    await uploadBytesResumable(
      iconRef,
      icone
    );

    const iconURL =
    await getDownloadURL(iconRef);

    /* IMAGENS */
    let imgs = [];

    for(let i=0;i<imagens.length;i++){

      setStatus(
        `📸 Enviando imagens (${i+1}/${imagens.length})`,
        "Quase finalizando..."
      );

      const imgRef =
      ref(storage,
      `${base}/img_${i}`);

      await uploadBytesResumable(
        imgRef,
        imagens[i]
      );

      const url =
      await getDownloadURL(imgRef);

      imgs.push(url);

    }

    /* FIREBASE */
    setStatus(
      "💾 Salvando informações...",
      "Finalizando upload"
    );

    await push(
      dbRef(db,"mods"),
      {

        nome,
        descricao,
        versao,
        categoria,

        zipURL,
        iconURL,

        imagens: imgs,

        dependencias,
        videos,

        data: Date.now(),

        downloads: 0,

        tamanhoMB,

        autorNick: usuario.nick

      }
    );

    setStatus(
      "✅ Upload concluído!",
      "Redirecionando..."
    );

    setTimeout(()=>{

      location.href =
      "MinhasPublicacoes.html";

    },1500);

  }catch(e){

    alert(e.message);

    document.getElementById("uploadModal")
    .style.display = "none";

  }

});

</script>

</body>
</html>
