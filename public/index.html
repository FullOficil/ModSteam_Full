<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja DayZombi</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .produto {
      width: min(92%, 430px);
      padding: 32px;
      border: 1px solid #333;
      border-radius: 16px;
      background: #1b1b1b;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }
    h1 { margin: 0 0 10px; }
    .descricao { color: #bbb; }
    .preco { margin: 25px 0; font-size: 34px; font-weight: bold; }
    button {
      width: 100%;
      padding: 15px 18px;
      border: 0;
      border-radius: 10px;
      background: #00a650;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { cursor: wait; opacity: 0.65; }
    #mensagem { min-height: 22px; margin-top: 16px; color: #ffb4b4; }
    .seguro { margin-top: 18px; color: #8c8c8c; font-size: 13px; }
  </style>
</head>
<body>
  <main class="produto">
    <h1>Acesso DayZombi</h1>
    <p class="descricao">Pagamento real para teste da integração.</p>
    <div class="preco">R$ 0,50</div>
    <button id="comprar" type="button">Comprar pelo Mercado Pago</button>
    <p id="mensagem"></p>
    <p class="seguro">A aprovação será confirmada pelo servidor, não pelo navegador.</p>
  </main>

  <script>
    const botao = document.querySelector("#comprar");
    const mensagem = document.querySelector("#mensagem");

    botao.addEventListener("click", async () => {
      botao.disabled = true;
      botao.textContent = "Abrindo checkout...";
      mensagem.textContent = "";

      try {
        const response = await fetch("/api/criar-preferencia", {
          method: "POST",
          headers: { "Content-Type": "application/json" }
        });

        const data = await response.json();

        if (!response.ok || !data.checkoutUrl) {
          throw new Error(data.erro || "Não foi possível criar o checkout.");
        }

        window.location.href = data.checkoutUrl;
      } catch (error) {
        mensagem.textContent = error.message;
        botao.disabled = false;
        botao.textContent = "Comprar pelo Mercado Pago";
      }
    });
  </script>
</body>
</html>
