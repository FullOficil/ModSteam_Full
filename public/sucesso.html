<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificando pagamento</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#111; color:#fff; font-family:Arial,sans-serif; }
    main { width:min(92%,540px); padding:32px; border:1px solid #333; border-radius:16px; background:#1b1b1b; text-align:center; }
    h1 { margin-top:0; }
    p { line-height:1.5; color:#cfcfcf; }
    .aprovado { color:#4ade80; }
    .erro { color:#f87171; }
    .pendente { color:#facc15; }
    a, button { color:#fff; }
    button { display:none; margin:18px auto 0; padding:11px 18px; border:0; border-radius:8px; background:#333; cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <h1 id="titulo">Verificando pagamento...</h1>
    <p id="mensagem">Aguarde. O servidor está consultando diretamente a API do Mercado Pago.</p>
    <p id="detalhes"></p>
    <a href="/">Voltar à loja</a>
    <button id="fechar" type="button">Fechar esta aba</button>
  </main>

  <script>
    "use strict";

    const titulo = document.querySelector("#titulo");
    const mensagem = document.querySelector("#mensagem");
    const detalhes = document.querySelector("#detalhes");
    const botaoFechar = document.querySelector("#fechar");
    const params = new URLSearchParams(window.location.search);
    const paymentId = params.get("payment_id") || params.get("collection_id");
    const pedidoId = params.get("pedido_id");
    const INTERVALO_MS = 3000;

    if (window.opener) {
      botaoFechar.style.display = "block";
      botaoFechar.addEventListener("click", () => window.close());
    }

    verificar();

    async function verificar() {
      if (!paymentId && !pedidoId) {
        mostrarErro("Pagamento não identificado", "A URL não trouxe payment_id nem pedido_id.");
        return;
      }

      const endpoint = paymentId
        ? `/api/verificar-pagamento?payment_id=${encodeURIComponent(paymentId)}`
        : `/api/verificar-pedido?pedido_id=${encodeURIComponent(pedidoId)}`;

      try {
        const response = await fetch(endpoint, { cache: "no-store" });
        const data = await response.json();

        if (data.aprovado) {
          mostrarAprovado(data);
          return;
        }

        if (["aguardando", "pending", "in_process", "indisponivel"].includes(data.status)) {
          titulo.textContent = "Aguardando confirmação";
          titulo.className = "pendente";
          mensagem.textContent = data.mensagem || "O pagamento ainda está sendo processado.";
          detalhes.textContent = data.pagamentoId ? `Pagamento: ${data.pagamentoId}` : "";
          window.setTimeout(verificar, INTERVALO_MS);
          return;
        }

        mostrarErro("Pagamento não liberado", data.mensagem || data.erro);
      } catch {
        titulo.textContent = "Tentando novamente...";
        titulo.className = "pendente";
        mensagem.textContent = "Não foi possível consultar o servidor agora.";
        window.setTimeout(verificar, INTERVALO_MS);
      }
    }

    function mostrarAprovado(data) {
      titulo.textContent = "Pagamento aprovado";
      titulo.className = "aprovado";
      mensagem.textContent = data.mensagem;
      detalhes.textContent = data.pagamentoId
        ? `Pagamento: ${data.pagamentoId} — Valor: R$ ${Number(data.valor).toFixed(2).replace(".", ",")}`
        : `Pedido: ${data.pedidoId}`;

      if (window.opener) {
        window.opener.postMessage(
          {
            tipo: "dayzombi-pagamento-aprovado",
            pedidoId: data.pedidoId,
            pagamentoId: data.pagamentoId,
            valor: data.valor
          },
          window.location.origin
        );
      }
    }

    function mostrarErro(textoTitulo, textoMensagem) {
      titulo.textContent = textoTitulo;
      titulo.className = "erro";
      mensagem.textContent = textoMensagem || "Pagamento não confirmado.";
      detalhes.textContent = "";
    }
  </script>
</body>
</html>
